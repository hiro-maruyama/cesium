<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://cesium.com/downloads/cesiumjs/releases/1.133/Build/Cesium/Cesium.js"></script>

<link
 href="https://cesium.com/downloads/cesiumjs/releases/1.133/Build/Cesium/Widgets/widgets.css"
 rel="stylesheet">

<style>
html,body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

#cesiumContainer{
    width:100%;
    height:100%;
}

#layerPanel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:5px;
    box-shadow:0 0 10px gray;
    font-family:sans-serif;
}

</style>

</head>

<body>

<div id="layerPanel">
    <label>
        <input type="checkbox" id="chkGBA" checked>
        GBA_Building
    </label>
    <br>
    <label>
        <input type="checkbox" id="chkTree" checked>
        Tree
    </label>
    <br>
    <label>
        <input type="range" id="trOpacity" min="0" max="100" value="100">
    </label>
    <br>
    <label>
        <input type="checkbox" id="chkRoad" checked>
        Road
    </label>
    <br>
    <label>
        <input type="range" id="roOpacity" min="0" max="100" value="100">
    </label>
    <br>
    <label>
        <input type="checkbox" id="chkWaterPipe" checked>
        WaterPipe
    </label>   
    <br> <br>
    <label>
        <input type="checkbox" id="chkOSM" checked>
        OpenStreetMap
    </label>   
    <br> 
    <label>
        <input type="range" id="osmOpacity" min="0" max="100" value="100">

    </label>
</div>    

<div id="cesiumContainer"></div>

<script>
let buildingTiles;
let treeTiles;
let osmLayer

Cesium.Ion.defaultAccessToken =

"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJmMDhkNDVhYi1mZTk5LTRlNjYtOTVjOS02ZTA3N2ZmZTcyYTAiLCJpZCI6Mzg2ODA2LCJpYXQiOjE3NzAxODI3NTJ9.rpTAwIkSWtQBVgc_ZkQWq13Zdoj3DQja9pOx5QN1PIs";


async function init() {

    const viewer = new Cesium.Viewer(
        'cesiumContainer',
        {
            terrainProvider:
                await Cesium.createWorldTerrainAsync(),
 //           baseLayer:false,
            baseLayerPicker:false,
            timeline:false,
            animation:false,          
        }
    );

    viewer.shadows = false;

    viewer.imageryLayers.removeAll();

    osmLayer=
        viewer.imageryLayers.addImageryProvider(
            new Cesium.OpenStreetMapImageryProvider({
                url: "https://tile.openstreetmap.org/"
            })
        );
   
        try {

// add GBAbuilding
            const buildingGBA = await Cesium.GeoJsonDataSource.load(
                "./geojson/building_BGA_3D_ellipsoid.geojson",
//               {
//                    stroke: Cesium.Color.BLUE,
//                    strokeWidth: 5
//                }
            );

            buildingGBA.entities.values.forEach(entity => {
                   if (entity.polygon) {
                        const h =
                            entity.properties.height.getValue();
                        const pos =
                            entity.polygon.hierarchy.getValue().positions;
                        const z =Cesium.Cartographic.fromCartesian(pos[0]).height;

                        entity.polygon.perPositionHeight = true;
                        entity.polygon.extrudedHeight = z + h;

                    entity.polygon.material =
                        Cesium.Color.fromBytes(180, 120, 120);//(180, 120, 120,220)

                    entity.polygon.outline = true;

                    entity.polygon.outlineColor =
                        Cesium.Color.fromBytes(120,80,80,255);
                    }
                });

            viewer.dataSources.add(buildingGBA);

 // add tree           
            treeTiles =
                await Cesium.Cesium3DTileset.fromUrl(
                    "./3Dtiles_tree/tileset_test.json"
                );

            treeTiles.style =
                new Cesium.Cesium3DTileStyle({
                    color: "color('limegreen')"
                });

            viewer.scene.primitives.add(treeTiles);

// add waterpipe
            const waterPipe = await Cesium.GeoJsonDataSource.load(
                "./geojson/water.geojson",
                {
                    stroke: Cesium.Color.BLUE,
                    strokeWidth: 5
                }
            );

            viewer.dataSources.add(waterPipe);
            console.log("waterPipe:", waterPipe);
            await viewer.zoomTo(waterPipe);

// add road
            const road =
                await Cesium.GeoJsonDataSource.load(
                    "./DEM/road_polygon_ellipsoid.geojson"
                );

            road.entities.values.forEach(entity =>
            {
                const positions =
                    entity.polygon.hierarchy.getValue().positions;

                entity.polygon.material =
                    Cesium.Color.fromBytes(255, 255, 190);

                entity.polygon.perPositionHeight =
                    true;

//                entity.polygon.outline =
//                    new Cesium.ConstantProperty(false);    

            });
            viewer.dataSources.add(road);

            const p = road.entities.values[0].polygon;
console.log("outline", p.outline);
console.log("outlineColor", p.outlineColor);
console.log("material", p.material);

            viewer.scene.globe.translucency.enabled = true;            
//            viewer.scene.globe.translucency.frontFaceAlpha = 0.2;
//            viewer.scene.globe.translucency.frontFaceAlpha = 0.7;
            viewer.scene.globe.translucency.backFaceAlpha = 0.7;

            viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;

            document
            .getElementById("chkGBA")
            .addEventListener(
                "change",
                function(){

                    buildingGBA.show =
                        this.checked;

                }
            );

            document
            .getElementById("chkTree")
            .addEventListener(
                "change",
                function(){

                    treeTiles.show =
                        this.checked;

                }
            );

            document
            .getElementById("trOpacity")
            .addEventListener(
                "input",
                function(){
                    const a=this.value /100.0;
                treeTiles.style=
                    new Cesium.Cesium3DTileStyle({
                        color:
                        `color('limegreen',${a})`
                    })
                }
            );

            document
            .getElementById("chkRoad")
            .addEventListener(
                "change",
                function(){

                    road.show =
                        this.checked;

                }
            );

            document
            .getElementById("roOpacity")
            .addEventListener(
                "input",
                function(){
                    const a =
                        this.value / 100.0;

                    road.entities.values.forEach(
                        entity => {

                            entity.polygon.material =
                                Cesium.Color.fromBytes(255,255,190)
                                    .withAlpha(a);
                        }
                    );          
//                    console.log("road opacity", a)         
                }
            );

            document
            .getElementById("chkWaterPipe")
            .addEventListener(
                "change",
                function(){

                    waterPipe.show =
                        this.checked;

                }
            );

            document
            .getElementById("chkOSM")
            .addEventListener(
                "change",
                function(){

                    osmLayer.show =
                        this.checked;

                }
            );

            document
            .getElementById("osmOpacity")
            .addEventListener(
                "input",
                function(){
                    osmLayer.alpha =
                        this.value / 100.0;
                }
            );            


            viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(74.6166,42.8676,831),
                    orientation: {
                        heading: Cesium.Math.toRadians(181.4),
                        pitch: Cesium.Math.toRadians(-8),//(-16.2),
                        roll: 0.0
                    }
                });

            setTimeout(() => {

                const m = buildingGBA.root._content._model;

                m.color = Cesium.Color.GREEN;
                m.silhouetteSize = 10;
                m.silhouetteColor = Cesium.Color.RED;

            },3000);

// クリックイベント

            const handler =
                new Cesium.ScreenSpaceEventHandler(
                    viewer.scene.canvas
                );

            handler.setInputAction(
                function(click){
                    const picked =
                        viewer.scene.pick(
                            click.position
                        );
                    console.log(picked);

                    if(picked && picked.content){
                        const url =
                            picked.content._resource.url;
                        const file =
                            url.split("/").pop();
                        let type = "Unknown";
                        if(url.includes("3Dtiles_tree")){
                            type = "Tree";
                        }
                        else if(url.includes("3Dtiles")){
                            type = "Building";
                        }

                        viewer.selectedEntity =
                            new Cesium.Entity({
                                name : type,
                                description :
                                    "<table>" +
                                    "<tr><td><b>Type</b></td><td>" +
                                    type +
                                    "</td></tr>" +
                                    "<tr><td><b>File</b></td><td>" +
                                    file +
                                    "</td></tr>" +
                                    "</table>"
                            });
                        console.log(file);
                    }
                },      

                Cesium.ScreenSpaceEventType.LEFT_CLICK
            );

        } catch (error) {
            console.error("Error loading tileset:", error);
        }



    }
//}
init();
</script>

</body>
</html>
